<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006FEE" />
    <title>InfiniteChat</title>
    <script>
      (() => {
        try {
          const queryTheme = new URLSearchParams(window.location.search).get('theme');
          const savedTheme = window.localStorage.getItem('infinitechat-theme');
          const theme = queryTheme === 'dark' || queryTheme === 'light' ? queryTheme : savedTheme === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.background = theme === 'dark' ? '#000000' : '#fafafa';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <script>
      document.body.dataset.theme = document.documentElement.dataset.theme || 'light';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
