spring:
  application:
    name: RealTimeCommunicationService
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

server:
  port: ${REALTIME_SERVICE_PORT:8083}
netty:
  name: NettyService
  port: ${NETTY_SERVICE_PORT:9000}

ack:
  retry:
    timeout-ms: 5000
    scan-interval-ms: 5000
    max-count: 3
