server:
  port: ${GATEWAY_PORT:10010}

spring:
  application:
    name: GateWay
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    gateway:
      httpclient:
        connect-timeout: 60000 # 连接超时时间，单位毫秒
        response-timeout: 60000 # 响应超时时间，单位毫秒
      default-filters:
        # 网关是唯一浏览器 CORS 边界。实际请求已由 globalcors 校验后再转发，
        # 内部服务不应再按浏览器 Origin 做二次 CORS 判定(否则 SSE POST 会 403)。
        - RemoveRequestHeader=Origin
      # 全局配置
      # 配置全局跨域
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # 用 allowedOriginPatterns(非 allowedOrigins):allowCredentials=true 时不能用 "*" 源,
            # 但可用 pattern。默认放行任意 localhost 端口(覆盖前端 5173/5180 等 dev 源,免去
            # dev-proxy strip-Origin 依赖);生产用 GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS 设真实前端源。
            # GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS 支持逗号分隔:
            #   http://localhost:[*],http://127.0.0.1:[*],http://100.*:[*],https://chat.example.com
            allowedOriginPatterns: "${GATEWAY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://100.*:[*]}"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 36000
      routes:
        #        - id: query_router
        #          uri: https://www.baidu.com
        #          predicates:
        #            - Query=green
        #            - After=2026-01-20T17:42:47.789-07:00[America/Denver]
        #
        #        - id: cookie_route
        #          uri: https://qq.com
        #          predicates:
        #            - Cookie=chocolate, ch.p
        #
        #        - id: header_route
        #          uri: https://m.weibo.cn/
        #          predicates:
        #            - Header=X-Request-Id, \d+

        # 登录认证服务
        - id: AuthenticationService
          uri: lb://AuthenticationService
          # uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/**
            # - After=2026-01-20T17:42:47.789-07:00[America/Denver]
          filters:
            - AddRequestHeader=X-Request-Source, InfiniteChat-GateWay
            - AddResponseHeader=X-Response-Source, InfiniteChat-GateWay
        #实时通信服务
        - id: RealTimeCommunicationService
          uri: lb://RealTimeCommunicationService
          predicates:
            - Path=/api/v1/message/**
        #Netty 长链接服务
        - id: NettyService
          #uri: ws://127.0.0.1:9000
          uri: lb:ws://NettyService
          predicates:
            - Path=/api/v1/netty
        # 消息模块
        - id: MessagingService
          uri: lb://MessagingService
          predicates:
            - Path=/api/v1/chat/**
        # 离线存储模块
        - id: OfflineDataStoreService
          uri: lb://OfflineDataStoreService
          predicates:
            - Path=/api/v1/offline/**
        # 朋友圈模块
        - id: MomentService
          uri: lb://MomentService
          predicates:
            - Path=/api/v1/moment/**
        # 联系人模块
        - id: ContactService
          uri: lb://ContactService
          predicates:
            - Path=/api/v1/contact/**
        # agent 服务(纳入统一网关 + 验签 + 注入 X-User-Id/Roles;非白名单;03-contracts §6)
        # agent 是 Spring Boot 3 / context-path=/api,直连其 18080,网关保留前缀转发
        - id: agent-backend
          uri: ${AGENT_GATEWAY_URI:http://localhost:18080}
          predicates:
            # agent 前缀:ReAct/记忆/RAG + 直连/自动路由对话(含 SSE)+ 逐 token 流。
            # /api/chat* 与 chat 自身的 /api/v1/chat/** 不重叠(无 v1),安全。
            - Path=/api/agent/**,/api/memory/**,/api/rag/**,/api/chat,/api/chat/**,/api/streamChat
