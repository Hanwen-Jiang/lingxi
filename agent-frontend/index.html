<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵犀 · Lingxi</title>
    <script>
      // Apply the saved/system color scheme before the bundle loads to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("infinitechat-theme");
          var dark =
            stored === "dark" || stored === "light"
              ? stored === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
